name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller FileShift.spec --noconfirm

      - name: Build portable FileShift.exe
        run: pyinstaller FileShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Smoke-test both builds
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\FileShift\FileShift.exe", "dist\FileShift.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item dist\FileShift.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\FileShift.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\FileShift-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\FileShift-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\FileShift\FileShift.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\*\shell\FileShift\command")) { throw "Context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\FileShift\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\FileShift") { throw "Uninstall left the context menu behind" }
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/FileShift.exe
            dist/FileShift-Setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build FileShift.app
        run: pyinstaller FileShift.spec --noconfirm

      - name: Self-test the app bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/FileShift.app/Contents/MacOS/FileShift --selftest
          codesign --verify --deep --verbose=2 dist/FileShift.app || true
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" dist/FileShift.app/Contents/Info.plist

      - name: Sign & notarize the app (only when Apple credentials are configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No Apple Developer ID configured: shipping ad-hoc signed (users see Gatekeeper's warning)."
            exit 0
          fi
          KC=build.keychain; KCPW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KCPW" $KC
          security import cert.p12 -k $KC -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" $KC
          # sign every nested binary first, then the bundle (hardened runtime + timestamp)
          find dist/FileShift.app/Contents -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "{}" || true
          codesign --force --deep --timestamp --options runtime --entitlements installer/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/FileShift.app
          codesign --verify --deep --strict --verbose=2 dist/FileShift.app
          ditto -c -k --keepParent dist/FileShift.app FileShift.zip
          xcrun notarytool submit FileShift.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/FileShift.app
          spctl --assess --type execute --verbose dist/FileShift.app
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: Make the .dmg (drag FileShift to Applications)
        run: |
          mkdir -p dmg
          cp -R dist/FileShift.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "FileShift" -srcfolder dmg -ov -format UDZO "dist/FileShift-mac-${{ matrix.arch }}.dmg"
          du -h "dist/FileShift-mac-${{ matrix.arch }}.dmg"
          if [ "$SIGNED" = "1" ]; then
            codesign --force --timestamp --sign "${{ secrets.MACOS_SIGN_IDENTITY }}" "dist/FileShift-mac-${{ matrix.arch }}.dmg"
            xcrun notarytool submit "dist/FileShift-mac-${{ matrix.arch }}.dmg" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
            xcrun stapler staple "dist/FileShift-mac-${{ matrix.arch }}.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/FileShift-mac-${{ matrix.arch }}.dmg

  publish:
    needs: [windows, macos]
    if: always() && github.event_name == 'push' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: Publish download (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FileShift (latest build)
          make_latest: true
          body: |
            **Windows**
            - **FileShift-Setup.exe** — recommended. Per-user install (no admin), Start menu, start with Windows, right-click "FileShift…" and Send To.
            - **FileShift.exe** — portable.

            **Mac** (macOS 11+)
            - **FileShift-mac-apple-silicon.dmg** — M1/M2/M3/M4 Macs.
            - **FileShift-mac-intel.dmg** — Intel Macs.
            Open the .dmg and drag FileShift to Applications.
            **First launch (until FileShift is notarized by Apple):** open FileShift once and click **Done** on the warning, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to "FileShift was blocked", and confirm. You only do this once.
            Or in Terminal: `xattr -dr com.apple.quarantine /Applications/FileShift.app`

            Enjoying FileShift? Tips are welcome: [Cash App $AtikaKadesha](https://cash.app/$AtikaKadesha) ♥

            Built automatically from commit ${{ github.sha }}.
          files: out/*

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
