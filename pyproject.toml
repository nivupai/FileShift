[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileshift"
version = "1.2.0"
description = "Shift+drag any file to convert or edit it from a liquid-glass radial menu."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "Pillow>=11.2",
    "pillow-heif>=0.18",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fileshift = "fileshift.app:main"

[tool.setuptools.packages.find]
include = ["fileshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
